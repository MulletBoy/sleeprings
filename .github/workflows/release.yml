name: Release

on:
  release:
    types: [published]

# No job gets more than it needs: the build runs without write access, and
# only the small upload job may write to the release.
permissions: {}

jobs:
  build:
    name: Build release files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: The tag must match the manifest version
        run: |
          version="$(python3 -c "import json; print(json.load(open('custom_components/sleep_rings/manifest.json'))['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "manifest.json says $version but the release tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build the card
        working-directory: card
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: The released bundle must be the committed one
        run: git diff --exit-code -- custom_components/sleep_rings/frontend

      - name: Zip the integration
        working-directory: custom_components/sleep_rings
        run: zip -r "$GITHUB_WORKSPACE/sleep_rings.zip" . -x "*/__pycache__/*" "__pycache__/*"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            sleep_rings.zip
            custom_components/sleep_rings/frontend/sleep-rings-card.js
          if-no-files-found: error

  upload:
    name: Attach the files to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" sleep_rings.zip \
            custom_components/sleep_rings/frontend/sleep-rings-card.js --clobber
